<!DOCTYPE html>

<meta charset="utf-8">

<title>OhMyAgent 项目架构思维导图</title>
<style>
  :root {
    --paper: #EFEEEA;
    --surface: #F6F6F7;
    --ink: #23201C;
    --muted: #77716A;
    --hairline: #DCD8D0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 34px 28px 46px;
  }
  .wrap { max-width: 1680px; margin: 0 auto; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 0 6px 18px; }
  h1 { font-size: 25px; font-weight: 650; letter-spacing: .2px; margin: 0 0 6px; }
  .sub { font-size: 12.5px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  button {
    font: inherit; font-size: 12px; color: var(--ink); cursor: pointer;
    background: #FBFAF7; border: 1px solid var(--hairline); border-radius: 8px;
    padding: 7px 13px; transition: background .15s ease, border-color .15s ease;
  }
  button:hover { background: #FFFFFF; border-color: #C8C3B9; }
  .legend { display: flex; flex-wrap: wrap; gap: 7px 14px; margin: 0 6px 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: #5E5851; }
  .chip i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
  .board {
    background: var(--surface); border: 1px solid #E2DED6; border-radius: 18px;
    overflow: hidden; box-shadow: 0 10px 30px rgba(35,32,28,.07), 0 1px 2px rgba(35,32,28,.05);
  }
  .board svg { display: block; width: 100%; height: auto; }
  @media (max-width: 900px) {
    body { padding: 20px 12px 30px; }
    header { flex-direction: column; align-items: flex-start; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .actions, .legend { display: none; }
    .board { border: none; box-shadow: none; }
  }
</style>
</head>

<script>
function downloadSVG() {
  const svg = document.querySelector('.board svg').outerHTML;
  const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + svg], { type: 'image/svg+xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'OhMyAgent-项目架构思维导图.svg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
